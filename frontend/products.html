<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h3>Manage Products</h3>

  <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openAddModal()">Add Product</button>

  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="productTableBody">
      <!-- Products will be loaded here -->
    </tbody>
  </table>
</div>

<!-- Modal for Add/Edit Product -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <div class="mb-3">
            <label for="productName" class="form-label">Name</label>
            <input type="text" class="form-control" id="productName" required>
          </div>
          <div class="mb-3">
            <label for="productPrice" class="form-label">Price</label>
            <input type="number" class="form-control" id="productPrice" required>
          </div>
          <div class="mb-3">
            <label for="productDescription" class="form-label">Description</label>
            <textarea class="form-control" id="productDescription"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="saveProductBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script src="js/edit.js"></script>
<script src="js/delete.js"></script>
<script>
async function loadProducts() {
  const products = await fetchProducts();
  const tbody = document.getElementById('productTableBody');
  tbody.innerHTML = '';
  products.forEach(product => {
    const row = `<tr>
      <td>${product.name}</td>
      <td>₱${product.price}</td>
      <td>
        <button class="btn btn-warning btn-sm" onclick="editProduct(${product.id})">Edit</button>
        <button class="btn btn-dark btn-sm" onclick="deleteProduct(${product.id})">Delete</button>
      </td>
    </tr>`;
    tbody.innerHTML += row;
  });
}
loadProducts();
</script>

</body>
</html>
