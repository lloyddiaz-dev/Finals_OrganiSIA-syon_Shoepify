<!DOCTYPE html>
<html>
<head>
  <title>Login - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-4">
  <span class="navbar-brand text-danger fw-bold">ShoePify</span>
  <a href="index.html" class="btn btn-outline-secondary btn-sm">Back to Home</a>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card p-4 shadow" style="width: 380px;">
    <h4 class="mb-1 fw-bold">Welcome Back!</h4>
    <p class="text-muted small mb-4">Login to your ShoePify account</p>

    <div id="errorMsg" class="alert alert-danger d-none"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-bold">Email</label>
        <input class="form-control" type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-danger w-100" id="loginBtn">Login</button>
    </form>

    <p class="mt-3 text-center small">No account? <a href="register.html" class="text-danger fw-bold">Register here</a></p>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
