<!DOCTYPE html>
<html>
<head>
  <title>Cart - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .payment-option { border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; cursor: pointer; transition: all 0.2s; }
    .payment-option:hover { border-color: #dc2626; background: #fff5f5; }
    .payment-option.selected { border-color: #dc2626; background: #fff5f5; }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white px-4 shadow-sm">
  <a class="navbar-brand text-danger fw-bold">ShoePify</a>
  <div class="d-flex gap-2">
    <!--<button onclick="history.back()" class="btn btn-outline-secondary btn-sm">← Back</button> -->
    <a href="dashboard.html" class="btn btn-outline-dark btn-sm">Home</a>
  </div>
</nav>

<div class="container mt-4">
  <h4 class="fw-bold mb-4">Your Cart</h4>

  <div id="emptyCart" class="text-center py-5" style="display:none;">
    <p class="text-muted fs-5">Your cart is empty.</p>
    <a href="dashboard.html" class="btn btn-danger">Start Shopping</a>
  </div>

  <div id="cartContent">
    <table class="table align-middle">
      <thead class="table-light">
        <tr>
          <th>Product</th>
          <th>Size</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cartTableBody"></tbody>
    </table>

    <div class="d-flex justify-content-end mt-3">
      <div class="text-end">
        <h5>Total: <span class="text-danger fw-bold" id="cartTotal">₱0</span></h5>
        <button class="btn btn-danger px-4 mt-2" id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">📦 Checkout Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">

          <!-- LEFT: User Info (from account) -->
          <div class="col-md-6">
            <h6 class="fw-bold text-danger mb-3">👤 Delivering To</h6>

            <!-- Saved info display -->
            <div class="bg-light rounded p-3 mb-3" id="savedUserInfo">
              <p class="mb-1 fw-bold" id="displayName"></p>
              <p class="mb-0 text-muted small" id="displayAddress"></p>
            </div>

            <!-- Option to use different address -->
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="useDifferentAddress">
              <label class="form-check-label small" for="useDifferentAddress">Use a different address</label>
            </div>

            <div id="differentAddressFields" style="display:none;">
              <input type="text" class="form-control mb-2" id="altName" placeholder="Full Name">
              <textarea class="form-control" id="altAddress" rows="2" placeholder="Delivery Address"></textarea>
            </div>

            <!-- Order Summary -->
            <div class="bg-light rounded p-3 mt-3">
              <p class="fw-bold mb-2 small">🧾 Order Summary</p>
              <div id="orderSummary"></div>
              <hr class="my-2">
              <div class="d-flex justify-content-between">
                <span class="fw-bold">Total:</span>
                <span class="text-danger fw-bold" id="modalTotal"></span>
              </div>
            </div>
          </div>

          <!-- RIGHT: Payment Method -->
          <div class="col-md-6">
            <h6 class="fw-bold text-danger mb-3">Payment Method</h6>
            <div class="d-flex flex-column gap-2">
              <label class="payment-option d-flex align-items-center gap-3">
                <input type="radio" name="paymentMethod" value="Cash on Delivery" checked class="form-check-input mt-0">
                <div>
                  <div class="fw-bold">Cash on Delivery</div>
                  <div class="text-muted small">Pay when your order arrives</div>
                  <span class="badge bg-warning text-dark mt-1">Pending until delivery</span>
                </div>
              </label>
              <label class="payment-option d-flex align-items-center gap-3">
                <input type="radio" name="paymentMethod" value="GCash" class="form-check-input mt-0">
                <div>
                  <div class="fw-bold">GCash</div>
                  <div class="text-muted small">Pay instantly via GCash</div>
                  <span class="badge bg-success mt-1">Paid instantly</span>
                </div>
              </label>
              <label class="payment-option d-flex align-items-center gap-3">
                <input type="radio" name="paymentMethod" value="Credit Card" class="form-check-input mt-0">
                <div>
                  <div class="fw-bold">Credit Card</div>
                  <div class="text-muted small">Visa, Mastercard accepted</div>
                  <span class="badge bg-success mt-1">Paid instantly</span>
                </div>
              </label>
              <label class="payment-option d-flex align-items-center gap-3">
                <input type="radio" name="paymentMethod" value="PayPal" class="form-check-input mt-0">
                <div>
                  <div class="fw-bold">PayPal</div>
                  <div class="text-muted small">Pay securely via PayPal</div>
                  <span class="badge bg-success mt-1">Paid instantly</span>
                </div>
              </label>
            </div>
          </div>

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger px-4" id="confirmOrderBtn">Place Order</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
