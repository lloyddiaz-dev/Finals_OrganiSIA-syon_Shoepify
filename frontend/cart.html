<!DOCTYPE html>
<html>
<head>
  <title>Cart - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light bg-white px-4 shadow-sm">
  <a class="navbar-brand text-danger fw-bold">ShoePify</a>
  <a href="dashboard.html" class="btn btn-outline-dark">Back to Shop</a>
</nav>

<div class="container mt-4">
  <h4 class="fw-bold mb-4">🛒 Your Cart</h4>

  <!-- Empty cart message -->
  <div id="emptyCart" class="text-center py-5" style="display:none;">
    <p class="text-muted fs-5">Your cart is empty.</p>
    <a href="dashboard.html" class="btn btn-danger">Start Shopping</a>
  </div>

  <!-- Cart table -->
  <div id="cartContent">
    <table class="table align-middle" id="cartTable">
      <thead class="table-light">
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cartTableBody"></tbody>
    </table>

    <!-- Total -->
    <div class="d-flex justify-content-end mt-3">
      <div class="text-end">
        <h5>Total: <span class="text-danger fw-bold" id="cartTotal">₱0</span></h5>
        <button class="btn btn-danger px-4 mt-2" id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal fade" id="checkoutModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">📦 Checkout Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-bold">Full Name</label>
          <input type="text" class="form-control" id="customerName" placeholder="Enter your full name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Delivery Address</label>
          <textarea class="form-control" id="customerAddress" rows="3" placeholder="Enter your delivery address"></textarea>
        </div>
        <hr>
        <div id="orderSummary"></div>
        <h6 class="text-end mt-2">Total: <span class="text-danger fw-bold" id="modalTotal"></span></h6>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmOrderBtn">Place Order</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
