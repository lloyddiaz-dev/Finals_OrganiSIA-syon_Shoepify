<!DOCTYPE html>
<html>
<head>
  <title>My Orders</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-light bg-white px-4 shadow-sm">
  <span class="navbar-brand text-danger fw-bold">ShoePify</span>
  <a href="dashboard.html" class="btn btn-outline-dark">Shop</a>
</nav>

<main class="container mt-4">
  <h4>My Orders</h4>

  <div class="card p-3 mb-3 shadow-sm">
    <div class="d-flex justify-content-between">
      <div>
        <h6>Nike Air Max</h6>
        <p class="mb-1">Quantity: 1</p>
        <p class="text-muted">₱3,500</p>
      </div>

      <div class="text-end">
        <span class="badge bg-warning text-dark">Pending</span>
      </div>
    </div>
  </div>

  <div class="card p-3 mb-3 shadow-sm">
    <div class="d-flex justify-content-between">
      <div>
        <h6>Adidas Ultraboost</h6>
        <p class="mb-1">Quantity: 1</p>
        <p class="text-muted">₱4,200</p>
      </div>

      <div class="text-end">
        <span class="badge bg-success">Delivered</span>
      </div>
    </div>
  </div>

</main>

<footer class="bg-dark text-white text-center p-3 mt-auto">
  <p class="mb-0">© 2026 ShoePify</p>
</footer>

</body>
</html>
