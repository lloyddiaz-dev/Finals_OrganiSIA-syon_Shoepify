<!DOCTYPE html>
<html>
<head>
  <title>My Orders - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Sticky footer fix */
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .page-content {
      flex: 1;
    }
    footer {
      margin-top: auto;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white px-4 shadow-sm">
  <span class="navbar-brand text-danger fw-bold">ShoePify</span>
  <a href="dashboard.html" class="btn btn-outline-dark">Back to Shop</a>
</nav>

<div class="page-content container mt-4">
  <h4 class="fw-bold mb-4">My Orders</h4>

  <!-- No orders message -->
  <div id="emptyOrders" class="text-center py-5" style="display:none;">
    <p class="text-muted fs-5">You have no orders yet.</p>
    <a href="dashboard.html" class="btn btn-danger">Start Shopping</a>
  </div>

  <!-- Orders list -->
  <div id="ordersList"></div>
</div>

<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2025 ShoePify</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
