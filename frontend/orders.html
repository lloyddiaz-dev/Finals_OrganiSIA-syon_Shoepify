<!DOCTYPE html>
<html>
<head>
  <title>My Orders - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .page-content { flex: 1; }
    .star { cursor: pointer; font-size: 1.5rem; color: #ccc; }
    .star.active { color: #ffc107; }
    .star:hover { color: #ffc107; }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white px-4 shadow-sm">
  <span class="navbar-brand text-danger fw-bold">ShoePify</span>
  <a href="dashboard.html" class="btn btn-outline-dark">Back to Shop</a>
</nav>

<div class="page-content container mt-4">
  <h4 class="fw-bold mb-4">📦 My Orders</h4>

  <div id="emptyOrders" class="text-center py-5" style="display:none;">
    <p class="text-muted fs-5">You have no orders yet.</p>
    <a href="dashboard.html" class="btn btn-danger">Start Shopping</a>
  </div>

  <div id="ordersList"></div>
</div>

<!-- REVIEW MODAL -->
<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">⭐ Write a Review</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="reviewProductId">
        <input type="hidden" id="reviewUserName">
        <p class="fw-bold mb-1">Product: <span id="reviewProductName" class="text-danger"></span></p>

        <!-- Star Rating -->
        <div class="mb-3">
          <label class="form-label fw-bold">Rating</label>
          <div id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <input type="hidden" id="selectedRating" value="0">
        </div>

        <!-- Comment -->
        <div class="mb-3">
          <label class="form-label fw-bold">Comment</label>
          <textarea class="form-control" id="reviewComment" rows="3" placeholder="Share your experience..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="submitReviewBtn">Submit Review</button>
      </div>
    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2025 ShoePify</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
