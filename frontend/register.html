<!DOCTYPE html>
<html>
<head>
  <title>Register - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm px-4">
  <span class="navbar-brand text-danger fw-bold">ShoePify</span>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card p-4 shadow" style="width: 420px;">
    <h4 class="mb-1 fw-bold">Create Account</h4>
    <p class="text-muted small mb-4">Register to start shopping at ShoePify</p>

    <div id="errorMsg" class="alert alert-danger d-none"></div>
    <div id="successMsg" class="alert alert-success d-none"></div>

    <form id="registerForm">

      <!-- Role Selection -->
      <div class="mb-3">
        <label class="form-label fw-bold">I am a:</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" id="roleCustomer" value="customer" checked>
            <label class="form-check-label" for="roleCustomer">Customer</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin">
            <label class="form-check-label" for="roleAdmin">Admin</label>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Full Name</label>
        <input class="form-control" type="text" id="name" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Email</label>
        <input class="form-control" type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Create a password" required>
      </div>

      <!-- Address (only for customers) -->
      <div class="mb-3" id="addressField">
        <label class="form-label fw-bold">Delivery Address</label>
        <textarea class="form-control" id="address" rows="2" placeholder="Enter your delivery address"></textarea>
        <div class="form-text">This will be used automatically at checkout</div>
      </div>

      <button type="submit" class="btn btn-danger w-100 mt-2" id="registerBtn">Register</button>
    </form>

    <p class="mt-3 text-center small">Already have an account? <a href="login.html" class="text-danger fw-bold">Login</a></p>
  </div>
</div>

<script src="js/register.js"></script>
</body>
</html>
