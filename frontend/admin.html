<!DOCTYPE html>
<html>
<head>
  <title>ShoePify Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-danger px-4">
  <span class="navbar-brand fw-bold">ShoePify Admin Panel</span>
  <div class="d-flex gap-2 align-items-center">
    <span class="text-white small" id="adminWelcome"></span>
   <!-- <button onclick="history.back()" class="btn btn-outline-light btn-sm">Back</button> -->
    <a href="orders-admin.html" class="btn btn-outline-light btn-sm">Orders</a>
    <a href="reviews-admin.html" class="btn btn-outline-light btn-sm">Reviews</a>
    <a href="dashboard.html" class="btn btn-outline-light btn-sm">View Shop</a>
    <button class="btn btn-light btn-sm text-danger fw-bold" id="adminLogoutBtn">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Product Management</h4>
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#addModal">+ Add New Product</button>
  </div>

  <input type="text" id="adminSearch" class="form-control mb-3" placeholder="Search products...">
  <p id="adminProductCount" class="text-muted small"></p>

  <div id="adminSpinner" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-2 text-muted">Loading products...</p>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle" id="adminTable" style="display:none;">
      <thead class="table-danger">
        <tr>
          <th>Image</th><th>Name</th><th>Brand</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">+ Add New Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label fw-bold">Product Name</label><input type="text" class="form-control" id="addName" placeholder="Enter product name"></div>
        <div class="mb-3"><label class="form-label fw-bold">Price (₱)</label><input type="number" class="form-control" id="addPrice" placeholder="Enter price"></div>
        <div class="mb-3"><label class="form-label fw-bold">Brand</label><input type="text" class="form-control" id="addBrand" placeholder="Enter brand"></div>
        <div class="mb-3"><label class="form-label fw-bold">Description</label><input type="text" class="form-control" id="addDescription" placeholder="Enter description"></div>
        <div class="mb-3"><label class="form-label fw-bold">Stock</label><input type="number" class="form-control" id="addStock" placeholder="Enter stock quantity"></div>
        <div class="mb-3"><label class="form-label fw-bold">Image URL</label><input type="text" class="form-control" id="addImageUrl" placeholder="e.g. img/NikeAirMax.jpeg"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="saveAddBtn">Add Product</button>
      </div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3"><label class="form-label fw-bold">Product Name</label><input type="text" class="form-control" id="editName"></div>
        <div class="mb-3"><label class="form-label fw-bold">Price (₱)</label><input type="number" class="form-control" id="editPrice"></div>
        <div class="mb-3"><label class="form-label fw-bold">Brand</label><input type="text" class="form-control" id="editBrand"></div>
        <div class="mb-3"><label class="form-label fw-bold">Description</label><input type="text" class="form-control" id="editDescription"></div>
        <div class="mb-3"><label class="form-label fw-bold">Stock</label><input type="number" class="form-control" id="editStock"></div>
        <div class="mb-3"><label class="form-label fw-bold">Image URL</label><input type="text" class="form-control" id="editImageUrl"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" id="saveEditBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>
<script>
  // Check if admin is logged in
  const adminUser = JSON.parse(localStorage.getItem('shoepify_user') || 'null');
  if (!adminUser || adminUser.role !== 'admin') {
    alert('Access denied! Admins only.');
    window.location.href = 'login.html';
  } else {
    const el = document.getElementById('adminWelcome');
    if (el) el.textContent = `Hi, ${adminUser.name}! `;
  }

  // Logout → redirect to index.html
  document.getElementById('adminLogoutBtn').addEventListener('click', () => {
    localStorage.removeItem('shoepify_user');
    localStorage.removeItem('shoepify_cart');
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
