<!DOCTYPE html>
<html>
<head>
  <title>ShoePify Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-danger px-4">
  <span class="navbar-brand fw-bold">ShoePify Admin Panel</span>
  <div class="d-flex gap-2">
    <a href="dashboard.html" class="btn btn-outline-light btn-sm">View Customer Dashboard</a>
    <a href="orders-admin.html" class="btn btn-dark btn-sm">Orders</a>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Product Management</h4>
    <!-- ADD NEW PRODUCT BUTTON -->
    <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#addModal">
      + Add New Product
    </button>
  </div>

  <!-- Search bar -->
  <input type="text" id="adminSearch" class="form-control mb-3" placeholder="Search products...">

  <!-- Product count -->
  <p id="adminProductCount" class="text-muted small"></p>

  <!-- Spinner while loading -->
  <div id="adminSpinner" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-2 text-muted">Loading products...</p>
  </div>

  <!-- PRODUCT TABLE -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle" id="adminTable" style="display:none;">
      <thead class="table-danger">
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Brand</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title fw-bold">+ Add New Product</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" class="form-control" id="addName" placeholder="Enter product name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Price (₱)</label>
          <input type="number" class="form-control" id="addPrice" placeholder="Enter price">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Brand</label>
          <input type="text" class="form-control" id="addBrand" placeholder="Enter brand">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <input type="text" class="form-control" id="addDescription" placeholder="Enter description">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Stock</label>
          <input type="number" class="form-control" id="addStock" placeholder="Enter stock quantity">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Image URL</label>
          <input type="text" class="form-control" id="addImageUrl" placeholder="e.g. img/NikeAirMax.jpeg">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="saveAddBtn">Add Product</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" class="form-control" id="editName" placeholder="Enter product name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Price (₱)</label>
          <input type="number" class="form-control" id="editPrice" placeholder="Enter price">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Brand</label>
          <input type="text" class="form-control" id="editBrand" placeholder="Enter brand">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <input type="text" class="form-control" id="editDescription" placeholder="Enter description">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Stock</label>
          <input type="number" class="form-control" id="editStock" placeholder="Enter stock quantity">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Image URL</label>
          <input type="text" class="form-control" id="editImageUrl" placeholder="e.g. img/NikeAirMax.jpeg">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" id="saveEditBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
