<!DOCTYPE html>
<html>
<head>
  <title>Admin Reviews - ShoePify</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .page-content { flex: 1; }
    .star-display { color: #ffc107; font-size: 1.1rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-danger px-4">
  <span class="navbar-brand fw-bold">ShoePify Admin Panel</span>
  <div class="d-flex gap-2">
    <button onclick="history.back()" class="btn btn-outline-light btn-sm">Back</button>
    <a href="admin.html" class="btn btn-outline-light btn-sm">Products</a>
    <a href="orders-admin.html" class="btn btn-outline-light btn-sm">Orders</a>
    <a href="dashboard.html" class="btn btn-outline-light btn-sm">View Shop</a>
  </div>
</nav>

<div class="page-content container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">⭐ Customer Reviews</h4>
    <span id="reviewCount" class="text-muted small"></span>
  </div>

  <div id="reviewSpinner" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-2 text-muted">Loading reviews...</p>
  </div>

  <div id="emptyReviews" class="text-center py-5" style="display:none;">
    <p class="text-muted fs-5">No reviews yet.</p>
  </div>

  <div class="table-responsive" id="reviewsTableContainer" style="display:none;">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-danger">
        <tr>
          <th>Customer</th>
          <th>Product ID</th>
          <th>Rating</th>
          <th>Comment</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="reviewsTableBody"></tbody>
    </table>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-auto">
  <p class="mb-0">© 2025 ShoePify Admin</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/reviews-admin.js"></script>
</body>
</html>
