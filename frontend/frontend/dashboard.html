<!DOCTYPE html>
<html>
<head>
  <title>ShoePify Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white px-4 shadow-sm">
  <a class="navbar-brand fw-bold text-danger">ShoePify</a>

  <div class="d-flex mx-auto w-50">
    <input class="form-control me-2" type="search" id="searchInput" placeholder="Search shoes...">
    <button class="btn btn-danger">Search</button>
  </div>

  <div class="d-flex gap-2">
    <a href="orders.html" class="btn btn-outline-dark">Orders</a>
    <a href="cart.html" class="btn btn-outline-dark">🛒 Cart</a>
  </div>
</nav>

<!-- BANNER -->
<div class="container mt-3">
  <div class="bg-danger text-white p-5 rounded text-center">
    <h2>🔥 Big Sale!</h2>
    <p>Up to 50% off on selected shoes</p>
  </div>
</div>

<!-- DYNAMIC PRODUCTS FROM API -->
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>All Products</h4>
    <span id="productCount" class="text-muted small"></span>
  </div>

  <!-- Spinner while loading -->
  <div id="loadingSpinner" class="text-center py-5">
    <div class="spinner-border text-danger" role="status"></div>
    <p class="mt-2 text-muted">Loading products...</p>
  </div>

  <!-- JS injects product cards here -->
  <div class="row g-3" id="productList"></div>
</div>

<!-- EDIT PRODUCT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">✏️ Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- Hidden field to store product ID -->
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" class="form-control" id="editName" placeholder="Enter product name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Price (₱)</label>
          <input type="number" class="form-control" id="editPrice" placeholder="Enter price">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Brand</label>
          <input type="text" class="form-control" id="editBrand" placeholder="Enter brand">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <input type="text" class="form-control" id="editDescription" placeholder="Enter description">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Stock</label>
          <input type="number" class="form-control" id="editStock" placeholder="Enter stock quantity">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" id="saveEditBtn">💾 Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (required for modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Products JS -->
<script src="js/products.js"></script>
</body>
</html>
