<!DOCTYPE html>
<html>
<head>
  <title>ShoePify Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white px-4 shadow-sm">
  <a class="navbar-brand fw-bold text-danger">ShoePify</a>

  <div class="d-flex mx-auto w-50">
    <input class="form-control me-2" type="search" id="searchInput" placeholder="Search shoes...">
    <button class="btn btn-danger">Search</button>
  </div>

  <div class="d-flex gap-2 align-items-center">
    <span class="text-muted small" id="welcomeUser"></span>

    <!-- Only visible to admin -->
    <div id="adminPanelBtn" style="display:none;">
      <a href="admin.html" class="btn btn-danger btn-sm">🔧 Admin Panel</a>
    </div>

    <!-- Only visible to customers -->
    <div id="customerBtns" style="display:none;">
      <a href="orders.html" class="btn btn-outline-dark btn-sm me-2">Orders</a>
      <a href="cart.html" class="btn btn-outline-dark btn-sm">🛒 Cart <span id="cartCount" class="text-danger fw-bold"></span></a>
    </div>

    <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Logout</button>
  </div>
</nav>

<!-- BANNER -->
<div class="container mt-3">
  <div class="bg-danger text-white p-5 rounded text-center">
    <h2>🔥 Big Sale!</h2>
    <p>Up to 50% off on selected shoes</p>
  </div>
</div>

<!-- SPINNER -->
<div id="loadingSpinner" class="text-center py-5">
  <div class="spinner-border text-danger" role="status"></div>
  <p class="mt-2 text-muted">Loading products...</p>
</div>

<!-- MEN'S SECTION -->
<div class="container mt-4">
  <h4 id="mensSectionTitle" class="mb-3 fw-bold">Men's Shoes</h4>
  <div class="row g-3" id="mensList"></div>
</div>

<!-- WOMEN'S SECTION -->
<div class="container mt-5">
  <h4 id="womensSectionTitle" class="mb-3 fw-bold">Women's Shoes</h4>
  <div class="row g-3" id="womensList"></div>
</div>

<div class="mt-5"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script>
<script>
  // Check if user is logged in
  const user = JSON.parse(localStorage.getItem('shoepify_user') || 'null');
  if (!user) {
    window.location.href = 'login.html';
  } else {
    const welcomeEl = document.getElementById('welcomeUser');
    if (welcomeEl) welcomeEl.textContent = `Hi, ${user.name}! `;

    if (user.role === 'admin') {
      // Show Admin Panel button, hide customer buttons
      document.getElementById('adminPanelBtn').style.display = 'block';
      document.getElementById('customerBtns').style.display = 'none';
    } else {
      // Hide Admin Panel button, show customer buttons
      document.getElementById('adminPanelBtn').style.display = 'none';
      document.getElementById('customerBtns').style.display = 'flex';
    }
  }

  // Logout → redirect to index.html
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('shoepify_user');
    localStorage.removeItem('shoepify_cart');
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
